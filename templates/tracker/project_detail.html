{% extends "base.html" %}
{% block title %}{{ project.name }} · TaskPilot{% endblock %}
{% block content %}
<div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-3">
  <div>
    <h1 class="h3 mb-0">{{ project.name }}</h1>
    <div class="text-muted">{{ project.description|default:"—" }}</div>
  </div>
  <div class="d-flex gap-2">
    <a class="btn btn-outline-secondary" href="{% url 'project_update' project.id %}">Edit</a>
    <a class="btn btn-outline-danger" href="{% url 'project_delete' project.id %}">Delete</a>
    <a class="btn btn-primary" href="{% url 'task_create' project.id %}">+ Task</a>
  </div>
</div>

<form class="row g-2 mb-3">
  <div class="col-md-6">
    <input class="form-control" name="q" placeholder="Пошук задач..." value="{{ request.GET.q }}">
  </div>
  <div class="col-md-3">
    <select class="form-select" name="status">
      <option value="">Статус: будь-який</option>
      <option value="todo" {% if request.GET.status == 'todo' %}selected{% endif %}>To Do</option>
      <option value="in_progress" {% if request.GET.status == 'in_progress' %}selected{% endif %}>In Progress</option>
      <option value="done" {% if request.GET.status == 'done' %}selected{% endif %}>Done</option>
    </select>
  </div>
  <div class="col-md-2">
    <select class="form-select" name="priority">
      <option value="">Пріоритет</option>
      <option value="1" {% if request.GET.priority == '1' %}selected{% endif %}>Low</option>
      <option value="2" {% if request.GET.priority == '2' %}selected{% endif %}>Medium</option>
      <option value="3" {% if request.GET.priority == '3' %}selected{% endif %}>High</option>
    </select>
  </div>
  <div class="col-md-1 d-grid">
    <button class="btn btn-outline-secondary">OK</button>
  </div>
</form>

<div id="board">
  {% include "tracker/partials/board.html" with project=project tasks=tasks %}
</div>

{% endblock %}
