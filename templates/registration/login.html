{% extends "base.html" %}
{% block title %}Login · TaskPilot{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4 shadow-sm">
      <h1 class="h4 mb-3">Вхід</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100">Увійти</button>
      </form>
      <div class="mt-3 small text-muted">
        Нема акаунта? <a href="{% url 'register' %}">Реєстрація</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
