{% extends "base.html" %}
{% block title %}Register · TaskPilot{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4 shadow-sm">
      <h1 class="h4 mb-3">Реєстрація</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100">Створити акаунт</button>
      </form>
      <div class="mt-3 small text-muted">
        Вже є акаунт? <a href="{% url 'login' %}">Увійти</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
